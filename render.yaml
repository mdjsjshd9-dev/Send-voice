# Optional: Render "Blueprint". Manual setup bhi chalega (README dekho).
services:
  - type: web
    name: wa-voice-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PAIRING_NUMBER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_KEY
        sync: false
